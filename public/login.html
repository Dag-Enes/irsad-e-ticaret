<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İrşad Hediyelik - Giriş & Kayıt</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-image: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.85)), url('resimler/arkaplan.jpg'); background-size: cover; background-position: center; background-attachment: fixed; color: #fff; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .auth-container { background: rgba(26, 26, 26, 0.95); padding: 40px; border-radius: 12px; border: 1px solid #c5a05933; box-shadow: 0 8px 30px rgba(0,0,0,0.8); width: 100%; max-width: 450px; text-align: center; backdrop-filter: blur(8px); }
        .auth-container h2 { color: #fff; margin-bottom: 5px; font-weight: 600; font-size: 28px; }
        .auth-container h2 span { color: #c5a059; }
        .auth-container .subtitle { color: #aaa; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #ccc; font-size: 13px; letter-spacing: 1px; }
        .form-group input { width: 100%; padding: 14px; background: #242424; border: 1px solid #333; border-radius: 8px; color: #fff; outline: none; box-sizing: border-box; transition: 0.3s; font-family: 'Poppins', sans-serif; }
        .form-group input:focus { border-color: #c5a059; box-shadow: 0 0 8px rgba(197,160,89,0.2); }
        .btn-action { width: 100%; padding: 14px; background: #c5a059; color: #121212; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 16px; margin-top: 10px; }
        .btn-action:hover { background: #b08d4b; transform: translateY(-2px); }
        .btn-guest { width: 100%; padding: 12px; background: transparent; color: #aaa; border: 1px dashed #444; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.3s; font-size: 14px; margin-top: 15px; }
        .btn-guest:hover { border-color: #c5a059; color: #c5a059; }
        .toggle-text { margin-top: 25px; font-size: 14px; color: #aaa; }
        .toggle-text a { color: #c5a059; text-decoration: none; font-weight: 600; cursor: pointer; }
        .toggle-text a:hover { text-decoration: underline; }
        .forgot-password { display: block; text-align: right; font-size: 12px; color: #aaa; margin-top: -10px; margin-bottom: 15px; text-decoration: none; transition: 0.3s; cursor: pointer; }
        .forgot-password:hover { color: #c5a059; text-decoration: underline; }
        .mesaj-kutusu { padding: 12px; border-radius: 6px; margin-top: 20px; margin-bottom: 20px; display: none; font-size: 14px; font-weight: 500; text-align: left; line-height: 1.5; }
        .hata { color: #e53935; background: rgba(229, 57, 53, 0.1); border: 1px solid #e53935; }
        .basari { color: #43a047; background: rgba(67, 160, 71, 0.1); border: 1px solid #43a047; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>İRŞAD HEDİYELİK<span id="sayfaEki">-GİRİŞ</span></h2>
        <p class="subtitle" id="sayfaAltBaslik">Koleksiyonları keşfetmek ve sipariş vermek için giriş yapın.</p>
        
        <div id="mesajKutusu" class="mesaj-kutusu"></div>

        <div id="loginFormu">
            <div class="form-group">
                <label>E-POSTA ADRESİ</label>
                <input type="email" id="loginEposta" placeholder="ornek@eposta.com" autocomplete="off">
            </div>
            <div class="form-group">
                <label>ŞİFRE</label>
                <input type="password" id="loginSifre" placeholder="••••••••">
            </div>
            <a onclick="sifremiUnuttum()" class="forgot-password">Şifremi Unuttum</a>
            
            <button class="btn-action" onclick="girisYap()">Giriş Yap</button>
            <button class="btn-guest" onclick="misafirOlarakDevamEt()">Misafir Olarak Ziyaret Et</button>
            <p class="toggle-text">Henüz hesabınız yok mu? <a onclick="formDegistir('kayit')">Kayıt Olun</a></p>
        </div>

        <div id="kayitFormu" style="display: none;">
            <div class="form-group">
                <label>ADINIZ VE SOYADINIZ</label>
                <input type="text" id="kayitIsim" placeholder="Ahmet Yılmaz" autocomplete="off">
            </div>
            <div class="form-group">
                <label>E-POSTA ADRESİ</label>
                <input type="email" id="kayitEposta" placeholder="ornek@eposta.com" autocomplete="off">
            </div>
            <div class="form-group">
                <label>TELEFON NUMARASI <span style="color:#888; font-size:11px;">(Sadece Rakam)</span></label>
                <input type="tel" id="kayitTelefon" placeholder="0555 123 45 67" autocomplete="off" maxlength="14" oninput="telefonFormatla(this)">
            </div>
            <div class="form-group">
                <label>ŞİFRE OLUŞTURUN <span style="color:#888; font-size:11px;">(Min. 6, Max. 20 Karakter)</span></label>
                <input type="password" id="kayitSifre" placeholder="••••••••" maxlength="20">
            </div>
            <button class="btn-action" onclick="kayitOl()">Kayıt Ol ve Hesabı Aç</button>
            <p class="toggle-text">Zaten üye misiniz? <a onclick="formDegistir('giris')">Giriş Yapın</a></p>
        </div>

        <div id="sifreSifirlamaFormu" style="display: none;">
    <div class="form-group">
        <label>KAYITLI E-POSTA ADRESİNİZ</label>
        <input type="email" id="sifirlamaEposta" placeholder="ornek@eposta.com" autocomplete="off">
    </div>
    <button class="btn-action" onclick="sifreSifirlamaTalebi()">Doğrulama Kodu Gönder</button>
    <p class="toggle-text"><a onclick="formDegistir('giris')">Giriş Ekranına Dön</a></p>
</div>

<div id="yeniSifreFormu" style="display: none;">
    <div class="form-group">
        <label>E-POSTA ADRESİNİZ</label>
        <input type="email" id="yeniSifreEposta" placeholder="ornek@eposta.com" autocomplete="off">
    </div>
    <div class="form-group">
        <label>E-POSTANIZA GELEN 6 HANELİ KOD</label>
        <input type="text" id="geciciSifreInput" placeholder="Örn: 123456" autocomplete="off" inputmode="numeric" maxlength="6">
    </div>
    <div class="form-group">
        <label>YENİ ŞİFRENİZ <span style="color:#888; font-size:11px;">(Min. 6, Max. 20 Karakter)</span></label>
        <input type="password" id="yeniSifreInput" placeholder="••••••••" maxlength="20">
    </div>
    <button class="btn-action" onclick="yeniSifreOlustur()">Yeni Şifremi Kaydet</button>
    <p class="toggle-text"><a onclick="formDegistir('giris')">Giriş Ekranına Dön</a></p>
</div>
    </div>

    <script>
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API_URL = isLocal ? 'http://localhost:5000/api' : '/api';

        // 📱 AKILLI TELEFON MASKESİ FONKSİYONU
        function telefonFormatla(input) {
            let num = input.value.replace(/\D/g, '');
            if (num.length > 0 && num[0] !== '0') { num = '0' + num; }
            if (num.length > 11) num = num.substring(0, 11);
            let formatli = '';
            if (num.length > 0) formatli += num.substring(0, 4);
            if (num.length > 4) formatli += ' ' + num.substring(4, 7);
            if (num.length > 7) formatli += ' ' + num.substring(7, 9);
            if (num.length > 9) formatli += ' ' + num.substring(9, 11);
            input.value = formatli;
        }

        function formDegistir(formTipi) {
    mesajGizle();
    document.getElementById('loginFormu').style.display = 'none';
    document.getElementById('kayitFormu').style.display = 'none';
    document.getElementById('sifreSifirlamaFormu').style.display = 'none';
    document.getElementById('yeniSifreFormu').style.display = 'none';

    if (formTipi === 'kayit') {
        document.getElementById('kayitFormu').style.display = 'block';
        document.getElementById('sayfaEki').innerText = '-KAYIT';
        document.getElementById('sayfaAltBaslik').innerText = 'Hemen ücretsiz üye olun, avantajları kaçırmayın.';
    } else if (formTipi === 'giris') {
        document.getElementById('loginFormu').style.display = 'block';
        document.getElementById('sayfaEki').innerText = '-GİRİŞ';
        document.getElementById('sayfaAltBaslik').innerText = 'Koleksiyonları keşfetmek ve sipariş vermek için giriş yapın.';
    } else if (formTipi === 'sifre') {
        document.getElementById('sifreSifirlamaFormu').style.display = 'block';
        document.getElementById('sayfaEki').innerText = '-ŞİFRE SIFIRLA';
        document.getElementById('sayfaAltBaslik').innerText = 'Kayıtlı e-posta adresinizi girin, size 6 haneli bir doğrulama kodu gönderelim.';
    } else if (formTipi === 'yeniSifre') {
        document.getElementById('yeniSifreFormu').style.display = 'block';
        document.getElementById('sayfaEki').innerText = '-YENİ ŞİFRE';
        document.getElementById('sayfaAltBaslik').innerText = 'E-postanıza gelen doğrulama kodu ile yeni şifrenizi belirleyin.';
    }
}

        function sifremiUnuttum() { formDegistir('sifre'); }
        function mesajGizle() { document.getElementById('mesajKutusu').style.display = 'none'; }
        
        function mesajGoster(metin, tip) {
            const kutu = document.getElementById('mesajKutusu');
            kutu.innerText = metin;
            kutu.className = `mesaj-kutusu ${tip}`;
            kutu.style.display = 'block';
        }

       // 🔑 GİRİŞ FONKSİYONU (Sepet Yönlendirme Destekli)
async function girisYap() {
    mesajGizle();
    const eposta = document.getElementById('loginEposta').value.trim();
    const sifre = document.getElementById('loginSifre').value;

    if(!eposta || !sifre) { mesajGoster("⚠️ Lütfen tüm alanları doldurun!", "hata"); return; }
    try {
        const response = await fetch(`${API_URL}/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ eposta, sifre }) });
        const veri = await response.json();

        if (response.ok && veri.success) {
            let tarayiciyaKaydedilecekRol = veri.kullanici.rol === 'uye' ? 'kullanici' : veri.kullanici.rol;
            
            localStorage.setItem('irsad_kullanici_rol', tarayiciyaKaydedilecekRol);
            localStorage.setItem('irsad_kullanici_bilgi', JSON.stringify(veri.kullanici));
            
            if(veri.token) { localStorage.setItem('irsad_token', veri.token); }
            
            // Kullanıcı sepetten yönlendirildiyse tekrar sepete gönderir
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('redirect') === 'sepet') {
                window.location.href = 'sepet.html';
            } else {
                window.location.href = tarayiciyaKaydedilecekRol === 'admin' ? 'admin.html' : 'index.html';
            }
        } else {
            mesajGoster("❌ " + (veri.hata || "E-posta veya şifre hatalı!"), "hata");
        }
    } catch (error) { mesajGoster("🔌 Sunucu bağlantısı başarısız!", "hata"); }
}

        async function kayitOl() {
            mesajGizle();
            const isim = document.getElementById('kayitIsim').value.trim();
            const eposta = document.getElementById('kayitEposta').value.trim();
            const telInput = document.getElementById('kayitTelefon').value.trim();
            const sifre = document.getElementById('kayitSifre').value;
            const telefon = telInput.replace(/\s/g, '');
            
            if(!isim || !eposta || !telefon || !sifre) { mesajGoster("⚠️ Lütfen tüm alanları eksiksiz doldurun!", "hata"); return; }
            if (telefon.length !== 11 || !telefon.startsWith('0')) { mesajGoster("⚠️ Lütfen telefon numaranızı eksiksiz girdiğinizden emin olun.", "hata"); return; }
            if (sifre.length < 6 || sifre.length > 20) { mesajGoster("⚠️ Şifreniz en az 6, en fazla 20 karakter uzunluğunda olmalıdır.", "hata"); return; }
            
            const epostaFiltresi = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!epostaFiltresi.test(eposta)) { mesajGoster("⚠️ Geçersiz e-posta formatı! Lütfen '@' işaretini doğru girdiğinizden emin olun.", "hata"); return; }
            
            try {
                const response = await fetch(`${API_URL}/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ isim, eposta, telefon, sifre }) });
                const veri = await response.json();

                if (response.ok && veri.success) {
                    alert(veri.mesaj);
                    formDegistir('giris');
                    document.getElementById('loginEposta').value = eposta;
                } else { mesajGoster("❌ " + (veri.hata || "Kayıt işlemi başarısız."), "hata"); }
            } catch (error) { mesajGoster("🔌 Sunucu hatası oluştu!", "hata"); }
        }

       function misafirOlarakDevamEt() {
       localStorage.setItem('irsad_kullanici_rol', 'misafir');
       localStorage.removeItem('irsad_kullanici_bilgi');
       localStorage.removeItem('irsad_sepet'); // Eski oturumdan kalan sepeti siler
       window.location.href = 'index.html';
}

async function sifreSifirlamaTalebi() {
    mesajGizle();
    const eposta = document.getElementById('sifirlamaEposta').value.trim();
    if(!eposta) { mesajGoster("⚠️ Lütfen kayıtlı e-posta adresinizi girin.", "hata"); return; }   
    
    mesajGoster("⏳ Doğrulama kodunuz hazırlanıyor...", "basari");    
    try {
        const response = await fetch(`${API_URL}/sifre-sifirla`, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ eposta }) 
        });
        const veri = await response.json();

        if (response.ok && veri.success) {
            // E-posta gönderimi başarılıysa doğrudan Adım 2 (Yeni Şifre Ekranı) açılır
            formDegistir('yeniSifre');
            document.getElementById('yeniSifreEposta').value = eposta;
            mesajGoster("📩 Doğrulama kodunuz e-posta adresinize gönderildi (15 dakika geçerli). Lütfen kodu girerek yeni şifrenizi belirleyin.", "basari");
        } else { 
            mesajGoster("❌ " + (veri.hata || "İşlem başarısız oldu."), "hata"); 
        }
    } catch (error) { 
        mesajGoster("🔌 Sunucu hatası oluştu!", "hata"); 
    }
}

        // Sepete yönlendirildiğinde ekrana uyarı mesajı çıkarır
    document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('msg') === 'siparis_gerekli') {
        mesajGoster("⚠️ Sipariş vermek için giriş yapılması gereklidir.", "hata");
    }
});

async function yeniSifreOlustur() {
    mesajGizle();
    const eposta = document.getElementById('yeniSifreEposta').value.trim();
    const geciciSifre = document.getElementById('geciciSifreInput').value.trim();
    const yeniSifre = document.getElementById('yeniSifreInput').value;

    if (!eposta || !geciciSifre || !yeniSifre) {
        mesajGoster("⚠️ Lütfen tüm alanları eksiksiz doldurun!", "hata");
        return;
    }

    if (yeniSifre.length < 6 || yeniSifre.length > 20) {
        mesajGoster("⚠️ Yeni şifreniz en az 6, en fazla 20 karakter olmalıdır.", "hata");
        return;
    }

    try {
        const response = await fetch(`${API_URL}/sifre-guncelle`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ eposta, geciciSifre, yeniSifre })
        });
        const veri = await response.json();

        if (response.ok && veri.success) {
            alert(veri.mesaj);
            formDegistir('giris');
            document.getElementById('loginEposta').value = eposta;
        } else {
            mesajGoster("❌ " + (veri.hata || "Şifre güncellenemedi."), "hata");
        }
    } catch (error) {
        mesajGoster("🔌 Sunucu hatası oluştu!", "hata");
    }
}

    </script>
</body>
</html>
